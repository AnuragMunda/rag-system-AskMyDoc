name: ask-my-docs

services:
  app:
    build:
      context: .
    image: ask-my-docs:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      STORAGE_DIR: /app/storage/documents
      CHROMA_URL: http://chroma:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - app-storage:/app/storage
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma-data:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >
          exec 3<>/dev/tcp/127.0.0.1/8000 &&
          printf 'GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env (for example docs.example.com)}
      APP_BASIC_AUTH_USER: ${APP_BASIC_AUTH_USER:?Set APP_BASIC_AUTH_USER in .env}
      APP_BASIC_AUTH_HASH: ${APP_BASIC_AUTH_HASH:?Set APP_BASIC_AUTH_HASH in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-storage:
  chroma-data:
  caddy-data:
  caddy-config:
